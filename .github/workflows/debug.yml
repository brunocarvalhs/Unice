name: Debug APK

"on":
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
      - main
      - master
  workflow_dispatch:

# A new push to the same branch/PR cancels the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  config:
    uses: ./.github/workflows/config.yml
    permissions:
      contents: read

  tests:
    uses: ./.github/workflows/tests.yml
    secrets: inherit
    permissions:
      contents: read
      checks: write

  build-debug-apk:
    name: Build debug APK
    needs: [config, tests]
    if: needs.config.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      # The Unity Android Docker image is ~20 GB and the hosted runner runs out of disk pulling it.
      # Drop preinstalled tools this job never uses (.NET, the runner's Android SDK, Haskell, CodeQL, tool cache).
      - name: Free disk space
        shell: bash
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /usr/local/share/boost \
                      /opt/hostedtoolcache /usr/local/share/powershell /usr/share/swift
          sudo docker image prune --all --force > /dev/null
          df -h /

      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Cache Unity Library
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            Library
            Temp
            obj
          key: unity-debug-${{ runner.os }}-${{ hashFiles('Packages/manifest.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: |
            unity-debug-${{ runner.os }}-

      - name: Build Android debug APK
        uses: game-ci/unity-builder@4423ee75828dff56037d1d1cfdac6b68e3a6ba00 # v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          unityVersion: 6000.6.3f1
          targetPlatform: Android
          buildName: Unice
          buildsPath: build/Debug
          androidExportType: androidPackage
          allowDirtyBuild: true

      - name: Upload APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Unice-debug-apk
          path: build/Debug/**/*.apk
          if-no-files-found: error
