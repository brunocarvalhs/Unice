name: Release

# Every push to master builds the Android AAB and uploads it to Google Play (internal track, draft).
# Promotion to production stays manual in the Play Console.
"on":
  push:
    branches:
      - master
      - main
  workflow_dispatch:

# Queue releases instead of cancelling one halfway through a store upload.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  targets:
    uses: ./.github/workflows/build-targets.yml
    permissions:
      contents: read

  tests:
    uses: ./.github/workflows/tests.yml
    secrets: inherit
    permissions:
      contents: read
      checks: write

  build-release:
    name: Build release AAB
    needs: [targets, tests]
    if: needs.targets.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read

    steps:
      # The Unity Android Docker image is ~20 GB and the hosted runner runs out of disk pulling it.
      # Drop preinstalled tools this job never uses (.NET, the runner's Android SDK, Haskell, CodeQL, tool cache).
      - name: Free disk space
        shell: bash
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /usr/local/share/boost \
                      /opt/hostedtoolcache /usr/local/share/powershell /usr/share/swift
          sudo docker image prune --all --force > /dev/null
          df -h /

      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Cache Unity Library
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            Library
            Temp
            obj
          key: unity-release-${{ runner.os }}-${{ hashFiles('Packages/manifest.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: |
            unity-release-${{ runner.os }}-

      - name: Build Android release AAB
        uses: game-ci/unity-builder@4423ee75828dff56037d1d1cfdac6b68e3a6ba00 # v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          unityVersion: 6000.6.3f1
          targetPlatform: Android
          buildName: Unice
          buildsPath: build/Release
          androidExportType: androidAppBundle
          # versionCode = major*1000000 + minor*1000 + patch of the semantic version from the git tags (game-ci)
          versioning: Semantic
          androidKeystoreName: ${{ secrets.ANDROID_KEYSTORE_NAME }}
          androidKeystoreBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          androidKeystorePass: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          androidKeyaliasName: ${{ secrets.ANDROID_KEYALIAS_NAME }}
          androidKeyaliasPass: ${{ secrets.ANDROID_KEYALIAS_PASS }}
          # symbols.zip for the IL2CPP native crash stacks (Play Console "native debug symbols")
          androidSymbolType: public
          allowDirtyBuild: true

      - name: Upload AAB artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Unice-release-aab
          path: build/Release/**/*.aab
          if-no-files-found: error

      # R8 mapping (AndroidMinifyRelease is on) + native symbols, for deobfuscating crashes in the Play Console.
      # Separate artifact with warn: a missing file here must not lose the AAB above.
      - name: Upload mapping and symbols artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Unice-release-debug-files
          path: |
            build/Release/**/*.symbols.zip
            Library/Bee/Android/**/outputs/mapping/release/mapping.txt
          if-no-files-found: warn

  # Separate job so a failed Play upload can be re-run without rebuilding the AAB.
  publish:
    name: Upload to Google Play
    needs: build-release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      # true once the Play service account secret exists (step-level env isn't visible to that step's `if`)
      HAS_PLAY_ACCOUNT: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON != '' }}

    steps:
      - name: Download AAB artifact
        if: env.HAS_PLAY_ACCOUNT == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: Unice-release-aab
          path: build/Release

      # The very first AAB of a new app must be uploaded by hand in the Play Console (download the
      # "Unice-release-aab" artifact above). Until GOOGLE_PLAY_SERVICE_ACCOUNT_JSON exists, this step is skipped.
      - name: Upload to Google Play
        if: env.HAS_PLAY_ACCOUNT == 'true'
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ secrets.GOOGLE_PLAY_PACKAGE_NAME }}
          releaseFiles: build/Release/**/*.aab
          # test builds go to the internal testing track as a draft: promote them in the Play Console.
          # Never "production" from CI. The very first upload of a new app must be done by hand in the Console.
          track: internal
          status: draft

  # Web version on GitHub Pages, from the same commit as the AAB: same assets, rules and wire protocol, so browser and
  # app players share rooms (Relay over WebSockets). Runs after the Android build: two Unity runs at once hit the
  # Unity Personal activation limit. Needs Settings > Pages > Source = "GitHub Actions".
  build-webgl:
    name: Build WebGL
    needs: [targets, tests, build-release]
    if: ${{ !cancelled() && needs.tests.result == 'success' && needs.targets.outputs.webgl == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read

    steps:
      - name: Free disk space
        shell: bash
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /usr/local/share/boost \
                      /opt/hostedtoolcache /usr/local/share/powershell /usr/share/swift
          sudo docker image prune --all --force > /dev/null
          df -h /

      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Cache Unity Library
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            Library
            Temp
            obj
          key: unity-webgl-${{ runner.os }}-${{ hashFiles('Packages/manifest.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: |
            unity-webgl-${{ runner.os }}-

      - name: Build WebGL
        uses: game-ci/unity-builder@4423ee75828dff56037d1d1cfdac6b68e3a6ba00 # v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          unityVersion: 6000.6.3f1
          targetPlatform: WebGL
          buildName: Unice
          buildsPath: build/Web
          versioning: Semantic
          allowDirtyBuild: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: build/Web/WebGL/Unice

  publish-webgl:
    name: Publish to GitHub Pages
    needs: build-webgl
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
