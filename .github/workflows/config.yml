name: Pipeline config

# Reads the platform switches from .github/pipeline-config.yml. Called by debug.yml and release.yml so both
# build only the platforms turned on there.
"on":
  workflow_call:
    outputs:
      android:
        description: "'true' when platforms.android is on"
        value: ${{ jobs.read.outputs.android }}

jobs:
  read:
    name: Read pipeline config
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      android: ${{ steps.platforms.outputs.android }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          sparse-checkout: .github/pipeline-config.yml
          sparse-checkout-cone-mode: false

      - name: Read platforms
        id: platforms
        shell: bash
        run: |
          set -euo pipefail
          config=.github/pipeline-config.yml
          for platform in ios pc console; do
            if [ "$(yq ".platforms.$platform" "$config")" = "true" ]; then
              echo "::error file=$config::platforms.$platform is on but the pipeline has no jobs for it yet"
              exit 1
            fi
          done
          echo "android=$(yq '.platforms.android' "$config")" >> "$GITHUB_OUTPUT"
